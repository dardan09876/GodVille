<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <!-- Game Container -->
    <div id="gameContainer">
      <!-- Top Bar -->
      <div id="topBar">
        <div id="navButtons">
          <div id="navButton">
            <button id="remoteNav">Remote</button>
          </div>
          <div id="navButton">
            <button id="diaryNav">Diary</button>
          </div>
          <div id="navButton">
            <button id="heroNav">Hero</button>
          </div>
          <div id="navButton">
            <button id="stuffNav">Stuff</button>
          </div>
        </div>
      </div>

      <!-- Second Bar -->
      <div id="secondBar">
        <div id="healthText">Health: <span id="healthValue">100</span></div>
        <div id="godPowerText">
          God Power: <span id="godPowerValue">50</span>
        </div>
        <div id="goldText">Gold: <span id="goldValue">0</span></div>
      </div>

      <!-- Third Bar -->
      <div id="thirdBar">
        <div id="enemyNameText">
          Enemy: <span id="enemyNameValue">None</span>
        </div>
      </div>
      <!-- Main Content -->
      <div id="mainContent">
        <div id="remoteContent">
          <button id="encourageButton" title="-25 God Power">Encourage</button>
          <button id="punishButton" title="-25 God Power">Punish</button>
        </div>
      </div>
    </div>
  </body>
</html>
